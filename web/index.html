<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F48E36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pantry</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='.1' y1='0' x2='.9' y2='1'%3E%3Cstop offset='0' stop-color='%23FFBD57'/%3E%3Cstop offset='1' stop-color='%23EC6E2D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='120' rx='27' fill='url(%23g)'/%3E%3Cpath d='M22 50h76a38 33 0 0 1-76 0z' fill='%23fff'/%3E%3Crect x='16' y='44' width='88' height='12' rx='6' fill='%23FFE4BF'/%3E%3Cellipse cx='48' cy='66' rx='5.5' ry='7' fill='%2322160E'/%3E%3Cellipse cx='74' cy='66' rx='5.5' ry='7' fill='%2322160E'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="stage" id="stage">
    <div class="stage-bg" aria-hidden="true"></div>
    <div class="stage-props" aria-hidden="true"></div>
    <div class="shadow-pool" aria-hidden="true"></div>
    <aside class="stage-side"></aside>
    <div class="caption" id="caption" role="status"></div>

    <div class="device" id="device">
      <div class="screen" id="screen">
        <div class="statusbar" id="statusbar"><span class="sb-time">6:02</span><span class="right"><svg class="sb" viewBox="0 0 18 12"></svg></span></div>
        <div class="app">
          <div class="views" id="views"></div>
          <div id="overlay"></div>
          <nav class="tabbar" id="tabbar" aria-label="Pantry"></nav>
        </div>
        <div class="scrim" id="scrim"></div>
        <div class="sheet" id="sheet" role="dialog" aria-modal="false"></div>
        <div class="lock" id="lock" hidden></div>
        <div class="splash hidden" id="splash"></div>
        <div class="toast" id="toast" role="status"></div>
        <div class="home-indicator" id="indicator"></div>
      </div>
      <span class="camera" aria-hidden="true"></span>
    </div>

    <div class="presenter" id="presenter"><span class="beats"></span><span class="time"></span></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
